[project]
name = "github-trends-insight"
version = "0.1.0"
description = "GitHub trending collector and analyzer for internship portfolio"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "streamlit>=1.36",
    "plotly>=5.22",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trends"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# 文档里的示例代码块不参与格式化, 避免 ruff 改写 AGENTS.md/README.md 的正文。
extend-exclude = ["AGENTS.md", "README.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line-length 由 formatter 处理

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = false
files = ["src"]
exclude = ["src/trends/dashboard/app.py"]  # Streamlit 入口暂不强制类型

[[tool.mypy.overrides]]
module = ["bs4.*", "streamlit.*", "plotly.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: 标记需要真实网络的测试（默认跳过）",
]

[tool.coverage.run]
source = ["src/trends"]
branch = true
omit = ["src/trends/dashboard/app.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
